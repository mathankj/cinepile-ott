[project]
name = "anjaneya-ott-backend"
version = "0.1.0"
description = "Anjaneya OTT backend — FastAPI + SQLAlchemy + Alembic"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",          # async Postgres driver
    "aiosqlite>=0.20",        # async SQLite for tests
    "bcrypt>=4.0",            # password hashing (used directly; passlib drops compat in bcrypt 5.x)
    "python-jose[cryptography]>=3.3",  # JWT
    "python-multipart>=0.0.12",        # form parsing for OAuth2 password flow
    "email-validator>=2.2",
    "httpx>=0.27",            # outbound HTTP + test client
    "structlog>=24.4",        # structured logging
    "razorpay>=1.4",          # billing (test + live)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-passlib",
    "locust>=2.32",           # load testing
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
