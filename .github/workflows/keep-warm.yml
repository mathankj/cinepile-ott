# Keeps the Render free-tier backend awake.
#
# Render's free plan spins a service down after ~15 minutes of inactivity, and
# the next request pays a 30-60 s cold-start (Python boot + dep install cache
# warm + Neon Postgres reconnect). For a demo this turns every first click
# after a quiet stretch into a long "Loading…" wait.
#
# This workflow pings /healthz every 10 minutes so the dyno never sleeps.
# /healthz is intentionally dependency-free (no DB hit), so the ping is cheap
# both for us and for Render — it just keeps the process from being paused.
name: keep-warm

on:
  schedule:
    # Every 5 minutes — GitHub Actions' minimum. We hit /readyz (not /healthz)
    # so the ping touches Postgres too. Neon's free tier suspends compute after
    # ~5 min idle and reboot costs 3-7 s; without this, every "first click"
    # after a quiet stretch waits on Neon waking up.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /readyz (warms Render dyno + Neon compute)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 90 \
              https://cinepile-api.onrender.com/readyz) && true
            echo "attempt $i: HTTP $code"
            # 200 = healthy. 503 = degraded but server replied (still counts as
            # a Neon ping, which is what we care about for keep-warm).
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then exit 0; fi
            sleep 5
          done
          echo "all attempts failed"
          exit 1
