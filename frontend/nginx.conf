# nginx config for the web container (NOT the host's nginx — the kotak apps'
# host nginx is never touched; this whole server block lives inside Docker and
# is published on one host port by compose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses; HLS video segments are already compressed.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API + health pass through to the api container ("api" resolves via the
    # compose network DNS).
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Admin video/subtitle uploads go through this route.
        client_max_body_size 512m;
        proxy_read_timeout 300s;
    }
    location = /healthz {
        proxy_pass http://api:8000;
    }
    # FastAPI interactive docs — handy while the client reviews the API.
    location /docs {
        proxy_pass http://api:8000;
    }
    location = /openapi.json {
        proxy_pass http://api:8000;
    }

    # Hashed build assets are immutable — cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path serves index.html (React Router owns the
    # URL space). index.html itself must revalidate so deploys show up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
